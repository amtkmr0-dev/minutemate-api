services:
  - type: web
    name: minutemate-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PAYMENTS_MODE
        value: razorpay
      - key: PAYMENTS_SIMULATION_ENABLED
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
      # Set these manually in the Render dashboard (never commit real values):
      # - RAZORPAY_KEY_ID
      # - RAZORPAY_KEY_SECRET
