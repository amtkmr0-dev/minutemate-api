<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="data:," />
<title>MinuteMate Admin Dashboard</title>
<style>
/* ================= design tokens ================= */
:root{
  --bg:#0a0e13;
  --bg-2:#0d1219;
  --surface:#111927;
  --surface-2:#16202f;
  --surface-3:#1c2939;
  --border:#22314a;
  --border-soft:#1a2638;
  --text:#e9eff6;
  --muted:#8f9db0;
  --faint:#63728a;
  --accent:#22d3ee;
  --accent-dim:rgba(34,211,238,.12);
  --accent-ink:#03222b;
  --ok:#34d399; --ok-bg:rgba(52,211,153,.13);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13);
  --bad:#f87171; --bad-bg:rgba(248,113,113,.13);
  --info:#60a5fa; --info-bg:rgba(96,165,250,.13);
  --muted-bg:rgba(143,157,176,.13);
  --input-bg:#0c1220;
  --scrim:rgba(3,6,10,.74);
  --shadow:0 10px 32px rgba(0,0,0,.5);
  --shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --radius:14px;
  --radius-sm:10px;
  --side-w:236px;
  --top-h:60px;
}
:root[data-theme="light"]{
  --bg:#eef1f6;
  --bg-2:#e6ebf2;
  --surface:#ffffff;
  --surface-2:#f5f8fc;
  --surface-3:#e9eef6;
  --border:#d7e0ec;
  --border-soft:#e2e9f2;
  --text:#152233;
  --muted:#5b6b80;
  --faint:#8694a8;
  --accent:#0891b2;
  --accent-dim:rgba(8,145,178,.1);
  --accent-ink:#ffffff;
  --input-bg:#ffffff;
  --scrim:rgba(18,30,46,.52);
  --shadow:0 10px 28px rgba(23,37,53,.14);
  --shadow-sm:0 2px 8px rgba(23,37,53,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--border) transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.45;font-size:15px;
}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-dim)}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:15px;height:15px}
svg.ic.lg{width:26px;height:26px}

/* ================= buttons ================= */
.btn{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:var(--radius-sm);padding:9px 14px;font-weight:600;font-size:.9rem;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:filter .15s ease,border-color .15s ease,background .15s ease;white-space:nowrap;
}
.btn:not(:disabled):hover{border-color:var(--accent);color:var(--text)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:not(:disabled):hover{filter:brightness(1.1);color:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#2b0a0a}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06301f}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:not(:disabled):hover{color:var(--text);background:var(--surface-2);border-color:var(--border)}
.btn.block{width:100%;padding:12px}
.btn.sm{padding:6px 10px;font-size:.83rem;border-radius:8px}
.btn.icon{padding:8px;border-radius:9px}
.btn .spin{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ================= login ================= */
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg-2)}
.login-card{
  width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--shadow);padding:30px 26px;
}
.login-mark{width:46px;height:46px;border-radius:13px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.login-card h1{margin:0 0 6px;font-size:1.4rem;letter-spacing:-.02em}
.login-card h1 span{color:var(--accent)}
.login-card .sub{margin:0 0 20px;color:var(--muted);font-size:.93rem}
.login-card label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:14px;font-weight:600}
.login-card input[type="password"]{
  display:block;width:100%;margin-top:7px;padding:12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--input-bg);outline:none;font-weight:400;
}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.checkline{display:flex;align-items:flex-start;gap:9px;font-size:.87rem;color:var(--muted);margin:2px 0 16px;cursor:pointer;font-weight:400}
.checkline input{width:17px;height:17px;margin-top:1px;accent-color:var(--accent);cursor:pointer;flex:none}
.hint{font-size:.8rem;color:var(--faint);margin:14px 0 0}
.error{
  background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:.88rem;margin:0 0 14px;font-weight:600;
}

/* ================= app shell ================= */
#app{min-height:100dvh;display:flex}
#sidebar{
  width:var(--side-w);flex:none;display:none;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100dvh;padding:18px 12px 14px;
  background:var(--bg-2);border-right:1px solid var(--border-soft);
}
@media(min-width:1024px){#sidebar{display:flex}}
.side-brand{font-weight:800;font-size:1.05rem;letter-spacing:-.01em;padding:2px 10px 16px;display:flex;align-items:center;gap:9px}
.side-brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent-dim);color:var(--accent);display:flex;align-items:center;justify-content:center}
.side-brand span{color:var(--accent)}
.side-nav{display:flex;flex-direction:column;gap:3px}
.navbtn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 11px;border-radius:10px;color:var(--muted);font-weight:600;font-size:.92rem;
  border:1px solid transparent;transition:background .13s ease,color .13s ease;
}
.navbtn:hover{color:var(--text);background:var(--surface-2)}
.navbtn.active{background:var(--accent-dim);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.navbtn .lbl{flex:1}
.count-pill{
  min-width:22px;height:21px;padding:0 6px;border-radius:11px;font-size:.72rem;font-weight:800;
  background:var(--warn);color:#2b1d02;display:inline-flex;align-items:center;justify-content:center;
}
.side-foot{margin-top:auto;border-top:1px solid var(--border-soft);padding-top:10px}
.side-foot .navbtn{color:var(--muted)}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;height:var(--top-h);flex:none;
  display:flex;align-items:center;gap:12px;padding:0 18px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-soft);
}
.topbar h1{margin:0;font-size:1.08rem;font-weight:800;letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-btn{
  display:inline-flex;align-items:center;gap:9px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:500;min-width:190px;
  transition:border-color .13s ease,color .13s ease;
}
.search-btn:hover{border-color:var(--accent);color:var(--text)}
.search-btn .grow{flex:1;text-align:left}
kbd{
  font-family:inherit;font-size:.7rem;font-weight:700;color:var(--muted);
  border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface-2);white-space:nowrap;
}
@media(max-width:640px){.search-btn{min-width:0}.search-btn .grow,.search-btn kbd{display:none}}

main#content{width:100%;max-width:1240px;margin:0 auto;padding:22px 20px 72px;flex:1}
@media(max-width:1023px){main#content{padding-bottom:110px}}

/* mobile bottom tab bar */
#tabbar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
@media(max-width:1023px){#tabbar{display:flex}}
#tabbar .navbtn{flex-direction:column;gap:3px;flex:1;padding:6px 2px;font-size:.6rem;font-weight:700;border:none;border-radius:9px;position:relative;letter-spacing:.01em}
#tabbar .navbtn svg.ic{width:20px;height:20px}
#tabbar .navbtn.active{background:transparent}
#tabbar .count-pill{position:absolute;top:1px;right:calc(50% - 21px);min-width:17px;height:16px;font-size:.62rem;padding:0 4px}

/* ================= section heads & controls ================= */
.tabhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 16px;flex-wrap:wrap}
.tabhead h2{margin:0;font-size:1.12rem;letter-spacing:-.01em}
.tabhead-r{display:flex;align-items:center;gap:10px}
.updated{font-size:.79rem;color:var(--faint)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.controls input[type="search"],.controls select{
  background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;outline:none;min-width:0;
}
.controls input[type="search"]{flex:1 1 230px}
.controls input:focus,.controls select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.controls .spacer{flex:1}
.seg-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg-label{font-size:.85rem;color:var(--muted);font-weight:600}
.seg-range{display:inline-flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:3px}
.seg-range .srg{border-radius:8px;padding:6px 13px;font-weight:700;font-size:.84rem;color:var(--muted);min-width:48px;transition:background .13s ease,color .13s ease}
.seg-range .srg.active{background:var(--accent);color:var(--accent-ink)}
.seg-range .srg:not(.active):hover{color:var(--text)}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.subhead h3{margin:0;font-size:1rem;letter-spacing:-.01em}
.period-title{font-weight:800;font-size:1rem}
.period-sub{font-size:.82rem;color:var(--muted)}

/* ================= stat cards ================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm)}
.stat .k{font-size:.73rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;font-weight:700}
.stat .v{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .s{font-size:.78rem;color:var(--faint);margin-top:4px}
.stat.accent{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.stat.accent .v{color:var(--accent)}
button.stat{text-align:left;width:100%;cursor:pointer;transition:border-color .13s ease,transform .13s ease}
button.stat:hover{border-color:var(--accent)}
.stat .go{font-size:.78rem;color:var(--accent);font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.period-wrap{margin-bottom:6px}
.life-row{display:flex;flex-wrap:wrap;gap:8px 22px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;margin-top:14px}
.life-item{display:flex;align-items:baseline;gap:8px}
.life-item .k{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.life-item .v{font-weight:800;font-variant-numeric:tabular-nums}

/* ================= live section ================= */
.live-card{background:var(--surface);border:1px solid color-mix(in srgb,var(--ok) 35%,var(--border));border-radius:var(--radius);padding:6px 16px 10px;margin-top:14px}
.live-head{display:flex;align-items:center;gap:9px;padding:10px 0 4px}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.live-head h3{margin:0;font-size:.98rem}
.live-head .cnt{font-size:.8rem;color:var(--muted)}
.live-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border-soft);flex-wrap:wrap}
.live-row:first-of-type{border-top:none}
.live-who{flex:1;min-width:180px}
.live-who .a{font-weight:700}
.live-who .b{font-size:.8rem;color:var(--muted)}
.live-elapsed{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.02rem;color:var(--ok);min-width:74px;text-align:right}
.live-none{padding:12px 0 14px;color:var(--muted);font-size:.9rem}

/* sparkline */
.spark-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:14px}
.spark-card h4{margin:0 0 4px;font-size:.93rem}
.spark-card .tot{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.spark-svg{width:100%;height:56px;display:block}
.spark-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.spark-area{fill:var(--accent);opacity:.1}
.spark-dot{fill:var(--accent)}

/* ================= tables ================= */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
thead th{
  text-align:left;font-size:.71rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top;word-break:break-word}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s ease}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 65%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.mono{font-variant-numeric:tabular-nums}
a.plink{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
a.plink:hover{text-decoration-color:var(--accent)}
.midsub{font-size:.77rem}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* badges */
.badge{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:.75rem;font-weight:700;white-space:nowrap;background:var(--muted-bg);color:var(--text);
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.offline{color:var(--muted)}
.dot-online{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600}
.dot-online i{width:8px;height:8px;border-radius:50%;font-style:normal}
.dot-online.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot-online.off i{background:var(--faint)}

/* pager */
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:var(--surface-2);flex-wrap:wrap;border-top:1px solid var(--border)}
.pager .info{font-size:.83rem;color:var(--muted)}
.pager .btns{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pgbtn{
  min-width:32px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);font-weight:700;font-size:.83rem;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;
}
.pgbtn:not(:disabled):hover{color:var(--text);border-color:var(--accent)}
.pgbtn.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pgbtn:disabled{opacity:.45;cursor:default}
.pgbtn.ellipsis{border:none;background:transparent;cursor:default;min-width:20px}

/* ================= cards (approvals / kyc) ================= */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(308px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}
.card .who{display:flex;gap:12px;align-items:flex-start}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--surface-3);flex:none}
.avatar-fallback{width:52px;height:52px;border-radius:50%;background:var(--surface-3);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:var(--accent)}
.who .nm{font-weight:700;font-size:1rem}
.who .ph{font-size:.85rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.86rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.card .bio{font-size:.88rem;color:var(--muted);margin:0}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{background:var(--surface-3);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.card .actions{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.card .actions .btn{flex:1}
.doc-thumb{width:100%;height:170px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:zoom-in;background:var(--surface-2);display:block}
.doc-thumb.missing{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;cursor:default;padding:12px;text-align:center}

/* ================= states: panels, skeleton, empty, error ================= */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px 22px;text-align:center;color:var(--muted)}
.panel .picon{width:52px;height:52px;margin:0 auto 13px;border-radius:15px;background:var(--surface-3);color:var(--faint);display:flex;align-items:center;justify-content:center}
.panel h3{margin:0 0 7px;color:var(--text);font-size:1rem}
.panel p{margin:0 auto 15px;font-size:.9rem;max-width:420px}
@keyframes shimmer{0%{opacity:.45}50%{opacity:1}100%{opacity:.45}}
.skl{background:var(--surface-3);border-radius:7px;animation:shimmer 1.3s ease-in-out infinite}
.skl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.skl-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px}
.skl-line{height:12px;margin:7px 0}
.skl-table{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px}
.skl-row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--border-soft);align-items:center}
.skl-row:last-child{border-bottom:none}
.skl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(308px,1fr));gap:12px}
.skl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}

/* ================= modal / lightbox ================= */
#modalWrap{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
#modalWrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow);width:100%;max-width:460px;padding:22px;max-height:90dvh;overflow:auto;
  animation:pop .16s ease;
}
@keyframes pop{from{transform:scale(.97) translateY(6px);opacity:.4}}
.sheet.wide{max-width:860px}
.sheet h3{margin:0 0 10px;font-size:1.05rem;padding-right:30px}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.sheet .row{display:flex;gap:8px;margin-top:16px}
.sheet .row .btn{flex:1}
.sheet .x{position:absolute;top:12px;right:12px}

.sheet textarea:focus{border-color:var(--accent)}

/* ================= toasts (top-right) ================= */
#toastWrap{position:fixed;top:14px;right:14px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(92vw,380px)}
.toast{
  pointer-events:auto;display:flex;gap:10px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:11px 14px;font-size:.87rem;font-weight:600;box-shadow:var(--shadow);
  animation:tin .18s ease;border-left:4px solid var(--faint);
}
.toast.ok{border-left-color:var(--ok)} .toast.ok .tic{color:var(--ok)}
.toast.bad{border-left-color:var(--bad)} .toast.bad .tic{color:var(--bad)}
.toast.info{border-left-color:var(--info)} .toast.info .tic{color:var(--info)}
.toast .tic{margin-top:1px}
.toast.out{opacity:0;transform:translateX(12px);transition:opacity .25s ease,transform .25s ease}
@keyframes tin{from{transform:translateX(16px);opacity:0}}

/* ================= profile slide-over ================= */
#profileWrap{position:fixed;inset:0;z-index:50}
#profileWrap[hidden]{display:none}
.pf-scrim{position:absolute;inset:0;background:var(--scrim)}
.pf-panel{
  position:absolute;top:0;right:0;bottom:0;width:100%;max-width:940px;
  background:var(--bg);border-left:1px solid var(--border);box-shadow:var(--shadow);
  display:flex;flex-direction:column;animation:pfIn .2s ease;
}
@keyframes pfIn{from{transform:translateX(60px);opacity:.4}}
.pf-head{
  flex:none;display:flex;align-items:center;gap:10px;padding:11px 16px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.pf-title{flex:1;font-weight:800;font-size:1.02rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-body{flex:1;overflow-y:auto;padding:18px 16px 56px}
.pf-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:flex;gap:16px;align-items:flex-start;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.pf-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--surface-3);flex:none}
.pf-avatar-fallback{width:88px;height:88px;border-radius:50%;background:var(--surface-3);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:2rem;color:var(--accent)}
.pf-who{flex:1;min-width:0}
.pf-who .nm{font-weight:800;font-size:1.28rem;letter-spacing:-.015em}
.pf-who .rn{color:var(--muted);font-size:.9rem;margin-top:1px}
.pf-who .id{color:var(--muted);font-size:.86rem;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.copyable{
  display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:.85rem;font-weight:600;
  border:1px dashed var(--border);border-radius:7px;padding:2px 8px;transition:border-color .13s ease,color .13s ease;
}
.copyable:hover{color:var(--accent);border-color:var(--accent)}
.copyable svg{width:12px;height:12px}
.pf-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.pf-sec{margin:24px 0 0}
.pf-sec > h3{margin:0 0 10px;font-size:1rem}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.pf-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px}
.pf-stat .k{font-size:.71rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;font-weight:700}
.pf-stat .v{font-size:1.1rem;font-weight:800;letter-spacing:-.01em;word-break:break-word}
.kyc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kyc-doc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.kyc-doc .doc-thumb{height:150px;margin-bottom:8px}
.kyc-doc .rowline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.kyc-doc .dtt{font-weight:700;font-size:.9rem}
.kyc-doc .meta{font-size:.78rem;color:var(--muted)}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.media-grid img{width:100%;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:zoom-in;background:var(--surface-2)}
@media(max-width:520px){.pf-hero{flex-direction:column}}

/* ================= reports / charts ================= */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:2px 0 6px}

.chart-card h4{margin:0 0 8px;font-size:.94rem}
.chart-svg{width:100%;height:auto;display:block}
.ax-r{fill:var(--muted);font-size:10px;text-anchor:end}
.ax-t{fill:var(--muted);font-size:10px;text-anchor:middle}
.gridln{stroke:var(--border-soft);stroke-width:1}
.bar{fill:var(--accent);transition:opacity .1s ease}
.bar:hover{opacity:.75}
.linep{fill:none;stroke:var(--ok);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.areaf{fill:var(--ok);opacity:.12}
.linedot{fill:var(--ok)}
.hit{fill:transparent;stroke:transparent;cursor:pointer}
.bar.hit{fill:var(--accent)}
.chart-tip{
  position:absolute;z-index:5;pointer-events:none;background:var(--surface-3);color:var(--text);
  border:1px solid var(--border);border-radius:9px;padding:7px 10px;font-size:.79rem;font-weight:600;

.chart-tip .tl{color:var(--muted);font-size:.72rem}

.break-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.break-label{min-width:120px}
.break-bar{flex:1;height:10px;background:var(--surface-3);border-radius:5px;overflow:hidden}

/* ================= command palette ================= */
#paletteWrap{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
#paletteWrap[hidden]{display:none}
.palette{
  position:relative;width:100%;max-width:620px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:pop .15s ease;
}

.p-item .pmain{flex:1;min-width:0}
.p-item .pt{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-item .ps{font-size:.77rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-item.sel{background:var(--accent-dim)}
.p-item.sel .pic{background:var(--surface);color:var(--accent)}
.p-empty{padding:22px;text-align:center;color:var(--muted);font-size:.9rem}
.p-foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--border-soft);font-size:.72rem;color:var(--faint);flex-wrap:wrap}
.p-foot span{display:inline-flex;gap:5px;align-items:center}

/* ================= mobile: tables → stacked cards ================= */
@media(max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr)}

  tbody{display:flex;flex-direction:column;gap:10px}

  tbody td{border:none;padding:7px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.9rem}

  td.num{text-align:right}

  .pf-panel{max-width:100%}
  .live-elapsed{text-align:left;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>

<!-- ============ LOGIN ============ -->
<div id="login" class="login-wrap">
  <form id="loginForm" class="login-card" autocomplete="off">
    <div class="login-mark"><svg class="ic lg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <h1>MinuteMate <span>Admin</span></h1>
    <p class="sub">Enter the admin secret to unlock the dashboard.</p>
    <div id="loginError" class="error" hidden></div>
    <label>Admin secret
      <input type="password" id="secretInput" name="admin-secret" autocomplete="current-password"
             placeholder="Paste the admin secret" required spellcheck="false" />
    </label>
    <label class="checkline">
      <input type="checkbox" id="rememberMe" />
      <span>Remember on this device<span id="rememberNote"></span></span>
    </label>
    <button type="submit" class="btn primary block" id="unlockBtn">Unlock dashboard</button>
    <p class="hint" id="loginHint">The secret is kept only in this tab's memory while you work, and cleared when you log out or close the tab.</p>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" hidden>
  <aside id="sidebar" aria-label="Dashboard sections">

    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">

    </div>
  </aside>
  <div class="main-col">

      <h1 id="pageTitle">Overview</h1>

      <button class="btn ghost sm" data-act="logout">Log out</button>

<script>
'use strict';
/* =============================================
   MinuteMate Admin Dashboard — talks directly to
   the backend API. No secret is ever hardcoded;
   the admin enters it on the login screen and it
   lives only in this tab's memory (plus, only when
   "Remember on this device" is checked, this
   device's local storage so it survives reloads).
   ============================================= */
const API = 'https://minutemate-api-9pb0.onrender.com';
const TZ = 'Asia/Kolkata';
const FETCH_TIMEOUT_MS = 30000;
const LS_SECRET = 'mmAdminSecret';
const LS_THEME = 'mmAdminTheme';

let SECRET = null;
let currentTab = 'overview';
let pendingModal = null;
let liveTimer = null;
let liveTick = null;

const state = {
  users:    { search:'', limit:20, offset:0 },
  creators: { search:'', limit:20, offset:0 },
  calls:    { status:'', limit:20, offset:0 },
  kyc:      { status:'pending', limit:20, offset:0 },
  overview: { range:'all' },
  reports:  { range:'1w' },
  badges:   { approvals:0, kyc:0 },
};

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const content = $('#content');

/* ---------- icons (inline SVG, no emoji) ---------- */
const ICONS = {
  overview:'<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  users:'<svg class="ic" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  creators:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
  calls:'<svg class="ic" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.25a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9z"/></svg>',
  approvals:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>',
  kyc:'<svg class="ic" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16.5c.6-1.4 1.7-2 3-2s2.4.6 3 2"/><path d="M14 9h5M14 13h5"/></svg>',
  reports:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 14v3M12 10v7M17 7v10"/></svg>',
  search:'<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
  check:'<svg class="ic sm" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
  alert:'<svg class="ic sm" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  info:'<svg class="ic sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>',
  download:'<svg class="ic sm" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
  inbox:'<svg class="ic lg" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  sun:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
};
const NAV = [
  ['overview','Overview'], ['users','Users'], ['creators','Creators'], ['calls','Calls'],
  ['approvals','Approvals'], ['kyc','KYC'], ['reports','Reports'],
];
const TITLES = { overview:'Overview', users:'Users', creators:'Creators', calls:'Calls', approvals:'Approvals', kyc:'KYC requests', reports:'Reports' };

/* ---------- formatting helpers ---------- */
function esc(v){
  if (v == null) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function inr(paise){
  const n = (Number(paise) || 0) / 100;
  return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function inr0(paise){
  const n = (Number(paise) || 0) / 100;
  return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits:0 });
}
function inrCompact(paise){
  const n = Math.abs((Number(paise) || 0) / 100);
  const trim = (v, unit) => '₹' + (Math.round(v * 10) / 10).toLocaleString('en-IN') + unit;
  if (n >= 1e7) return trim(n / 1e7, ' Cr');
  if (n >= 1e5) return trim(n / 1e5, ' L');
  if (n >= 1e3) return trim(n / 1e3, 'K');
  return '₹' + String(Math.round(n));
}
function signedInr(paise){
  const v = Number(paise) || 0;
  const sign = v < 0 ? '−' : (v > 0 ? '+' : '');
  return sign + inr(Math.abs(v));
}
function rupeeNum(paise){ return ((Number(paise) || 0) / 100).toFixed(2); }
function numFmt(n){ return (Number(n) || 0).toLocaleString('en-IN'); }
function fmtDur(sec){
  sec = Math.max(0, Math.round(Number(sec) || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h) return h + 'h ' + String(m).padStart(2,'0') + 'm';
  if (m) return m + 'm ' + String(s).padStart(2,'0') + 's';
  return s + 's';
}
function fmtDurClock(sec){
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const mm = h ? String(m).padStart(2,'0') : String(m);
  return (h ? h + ':' : '') + mm + ':' + String(s).padStart(2,'0');
}
function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString('en-GB', { timeZone:TZ, day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hour12:false });
}
function fmtDateFull(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString('en-GB', { timeZone:TZ, day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }) + ' IST';
}
/* Relative IST time ("2h ago") with the absolute IST timestamp in the tooltip. */
function relTime(iso){
  if (!iso) return '<span class="muted">—</span>';
  const d = new Date(iso);
  if (isNaN(d)) return '<span>' + esc(iso) + '</span>';
  const sec = Math.floor((Date.now() - d.getTime()) / 1000);
  let rel;
  if (sec < 0) rel = 'just now';
  else if (sec < 45) rel = 'just now';
  else if (sec < 3600) rel = Math.max(1, Math.floor(sec / 60)) + 'm ago';
  else if (sec < 86400) rel = Math.floor(sec / 3600) + 'h ago';
  else if (sec < 86400 * 30) rel = Math.floor(sec / 86400) + 'd ago';
  else if (sec < 86400 * 365) rel = Math.floor(sec / (86400 * 30)) + 'mo ago';
  else rel = Math.floor(sec / (86400 * 365)) + 'y ago';
  return '<span title="' + esc(fmtDateFull(iso)) + '">' + rel + '</span>';
}
function nowStamp(){

/* Field may be an array, a JSON-encoded array string, or a comma-separated string — API is inconsistent. */
function jsonArr(v){
  if (Array.isArray(v)) return v.filter(x => x != null && x !== '').map(String);
  if (typeof v === 'string'){
    const s = v.trim();
    if (s.startsWith('[')){
      try { const j = JSON.parse(s); if (Array.isArray(j)) return j.filter(x => x != null && x !== '').map(String); } catch (e) { /* fall through */ }
      return s ? [s.replace(/^\[|\]$/g, '').replace(/^"|"$/g, '')].filter(Boolean) : [];
    }
    return s ? [s] : [];
  }
  return (v == null || v === '') ? [] : [String(v)];
}
function tagList(v){
  if (typeof v === 'string' && v.indexOf(',') > -1 && !v.trim().startsWith('['))
    return v.split(',').map(x => x.trim()).filter(Boolean);
  return jsonArr(v);
}
function tagRow(arr){
  const a = Array.isArray(arr) ? arr : tagList(arr);
  if (!a.length) return '<span class="muted">—</span>';
  return '<span class="tagrow">' + a.map(x => '<span class="tag">' + esc(String(x)) + '</span>').join('') + '</span>';
}

/* ---------- API (timeout + friendly failures) ---------- */
async function api(path, opts){
  opts = opts || {};
  const url = new URL(API + path);
  const p = opts.params || {};
  for (const k of Object.keys(p)){
    if (p[k] !== '' && p[k] != null) url.searchParams.set(k, p[k]);
  }
  url.searchParams.set('adminSecret', SECRET);
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  let res;
  try {
    res = await fetch(url.toString(), {
      method: opts.method || 'GET',
      headers: opts.body ? { 'Content-Type':'application/json' } : {},
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: ctrl.signal,
    });
  } catch (e) {
    clearTimeout(to);
    const err = new Error(e && e.name === 'AbortError'
      ? 'The server took too long to respond. It may be waking up — retry in about 30 seconds.'
      : 'Network unreachable. Check your connection, or the server may be waking up.');
    err.code = 'network';
    throw err;
  }
  clearTimeout(to);
  if (res.status === 403){
    const err = new Error('The admin secret was rejected (wrong secret). Please unlock again.');
    err.code = 'auth';
    throw err;
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* non-json body */ }
  if (!res.ok){
    const err = new Error((data && data.error) || ('Request failed (HTTP ' + res.status + ')'));
    err.code = 'http';
    throw err;
  }
  return data;
}

/* Fetch every page of a list endpoint (used by CSV export-all). */
async function fetchAllPages(path, baseParams, listKey){
  const out = [];
  let offset = 0;
  const limit = 100;
  for (let guard = 0; guard < 500; guard++){
    const d = await api(path, { params: Object.assign({}, baseParams || {}, { limit, offset }) });
    const rows = d[listKey] || [];
    for (const r of rows) out.push(r);
    const total = Number(d.total);
    offset += rows.length;
    if (!rows.length) break;
    if (isFinite(total) && offset >= total) break;
    if (!isFinite(total) && rows.length < limit) break;
  }
  return out;
}

}

/* numbered pagination: first / prev / pages / next / last */
function pagerHtml(total, limit, offset){
  total = Number(total) || 0;
  const pages = Math.max(1, Math.ceil(total / limit));
  const cur = total === 0 ? 0 : Math.floor(offset / limit) + 1;
  const from = total === 0 ? 0 : offset + 1;
  const to = Math.min(offset + limit, total);
  const nums = [];
  if (pages <= 7){ for (let i = 1; i <= pages; i++) nums.push(i); }
  else {
    const keep = [1, 2, cur - 1, cur, cur + 1, pages - 1, pages].filter((v, i, a) => v >= 1 && v <= pages && a.indexOf(v) === i).sort((a, b) => a - b);
    let prev = 0;
    for (const n of keep){ if (prev && n - prev > 1) nums.push('…'); nums.push(n); prev = n; }
  }
  const dis = p => (cur <= 1 && (p === 'first' || p === 'prev')) || (cur >= pages && (p === 'next' || p === 'last')) || total === 0;
  const btn = (label, page, opts) => {
    opts = opts || {};
    return '<button type="button" class="pgbtn' + (opts.cur ? ' cur' : '') + (opts.ellipsis ? ' ellipsis' : '') +
      '" data-act="page-go" data-page="' + page + '"' + ((opts.disabled || opts.ellipsis) ? ' disabled' : '') +
      (opts.title ? ' title="' + opts.title + '"' : '') + '>' + label + '</button>';
  };
  let h = '<div class="pager"><span class="info">Showing ' + from + '–' + to + ' of ' + numFmt(total) +
    (total ? ' · Page ' + cur + ' of ' + pages : '') + '</span><div class="btns">';
  h += btn('«', 1, { disabled: dis('first'), title:'First page' });
  h += btn('‹', Math.max(1, cur - 1), { disabled: dis('prev'), title:'Previous page' });
  for (const n of nums) h += (n === '…') ? btn('…', 0, { ellipsis:true }) : btn(String(n), n, { cur: n === cur });
  h += btn('›', Math.min(pages, cur + 1), { disabled: dis('next'), title:'Next page' });
  h += btn('»', pages, { disabled: dis('last'), title:'Last page' });
  return h + '</div></div>';
}

/* ---------- copy to clipboard ---------- */
async function copyText(v){
  const txt = String(v == null ? '' : v);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(txt);
      toast('Copied: ' + txt, 'ok');
      return;
    }
    throw new Error('no clipboard api');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    toast(ok ? 'Copied: ' + txt : 'Copy failed — value: ' + txt, ok ? 'ok' : 'bad');
  }
}

function csvVal(v){

  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function downloadCSV(name, header, rows){

  const blob = new Blob(['﻿' + out], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) {} a.remove(); }, 600);
}

function svgSparkline(buckets){
  const vals = buckets.map(b => Number(b.revenuePaise) || 0);
  const W = 640, H = 56, pad = 4;
  const max = Math.max.apply(null, vals.concat([1]));
  const min = Math.min.apply(null, vals.concat([0]));
  const span = (max - min) || 1;
  const n = vals.length;
  const x = i => pad + (W - pad * 2) * (n === 1 ? 0.5 : i / (n - 1));
  const y = v => H - pad - ((v - min) / span) * (H - pad * 2);
  const pts = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1));
  let h = '<svg class="spark-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="7 day revenue sparkline">';
  if (n > 1) h += '<polygon class="spark-area" points="' + pad + ',' + H + ' ' + pts.join(' ') + ' ' + (W - pad) + ',' + H + '"/>';
  if (n > 1) h += '<polyline class="spark-line" points="' + pts.join(' ') + '"/>';
  if (n) h += '<circle class="spark-dot" cx="' + x(n - 1).toFixed(1) + '" cy="' + y(vals[n - 1]).toFixed(1) + '" r="3.5"/>';
  return h + '</svg>';
}
async function loadSparkline(){
  const w = $('#sparkWrap'), t = $('#sparkTot');
  if (!w) return;
  try {
    const d = await api('/api/admin/dashboard/reports/overview', { params:{ range:'1w' } });
    if (!$('#sparkWrap')) return;
    const buckets = d.buckets || [];
    const total = buckets.reduce((a, b) => a + (Number(b.revenuePaise) || 0), 0);
    if (t) t.textContent = inr(total) + ' across ' + buckets.length + ' days';
    w.innerHTML = buckets.length ? svgSparkline(buckets) : '<div class="muted" style="font-size:.88rem">No revenue data yet.</div>';
  } catch (e) {
    if (t) t.textContent = 'Revenue trend unavailable right now.';
    if (w) w.innerHTML = '';
  }
}

/* ---------- LIVE calls (15s auto-refresh, paused when tab hidden) ---------- */
function stopLiveTimers(){
  if (liveTimer){ clearInterval(liveTimer); liveTimer = null; }
  if (liveTick){ clearInterval(liveTick); liveTick = null; }
}
function startLiveTimers(){
  stopLiveTimers();
  liveTimer = setInterval(() => { if (!document.hidden) refreshLive(); }, 15000);
  liveTick = setInterval(tickLiveElapsed, 1000);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && currentTab === 'overview' && SECRET) refreshLive();
});
async function refreshLive(){
  const list = $('#liveList');
  if (!list || currentTab !== 'overview') return;
  try {
    const d = await api('/api/admin/dashboard/calls', { params:{ limit:25, offset:0 } });
    const rows = (d.calls || []).filter(c => ['ongoing','in_progress','ringing','live','active'].includes(String(c.status || '').toLowerCase()));
    const cnt = $('#liveCnt');
    if (cnt) cnt.textContent = rows.length ? rows.length + ' in progress' : '';
    const ovKyc = $('#ovKycCount');
    if (ovKyc) ovKyc.textContent = String(state.badges.kyc);
    if (!rows.length){
      list.innerHTML = '<div class="live-none">No calls in progress right now.</div>';
      return;
    }
    list.innerHTML = rows.map(c => {
      const start = c.startedAt || c.createdAt || '';
      return '<div class="live-row">' +
        '<div class="live-who"><div class="a">' +
          idLink('user', c.userId, esc(c.userName || 'User')) +
          ' <span class="faint">→</span> ' +
          idLink('creator', c.creatorId, esc(c.creatorName || 'Creator')) +
        '</div><div class="b">' + esc(cap(c.type)) + ' call · ' + esc(cap(String(c.status || '').replace('_',' '))) + '</div></div>' +
        badge(c.status) +
        '<div class="live-elapsed" data-live-start="' + esc(start) + '">' + fmtDurClock((Date.now() - new Date(start).getTime()) / 1000) + '</div>' +
      '</div>';
    }).join('');
  } catch (e) {
    list.innerHTML = '<div class="live-none">Could not load live calls. Will retry automatically.</div>';
  }
}
function tickLiveElapsed(){
  $$('[data-live-start]').forEach(el => {
    const t = new Date(el.dataset.liveStart).getTime();
    if (isFinite(t)) el.textContent = fmtDurClock((Date.now() - t) / 1000);
  });
}

function wireSearch(inputId, key, updateFn){
  const el = $('#' + inputId);
  if (!el) return;
  let t;
  el.addEventListener('input', e => {
    clearTimeout(t);
    t = setTimeout(() => {
      state[key].search = e.target.value.trim();
      state[key].offset = 0;
      updateFn();
    }, 300);
  });
}

function openKycConfirm(decision, id, name){

    body: 'Are you sure you want to <strong>' + (isApprove ? 'approve' : 'reject') + '</strong> the document submitted by <strong>' + esc(name || 'this creator') + '</strong>?',
    html: '<label for="kycNote">Note to creator (optional)</label><textarea id="kycNote" placeholder="Shown to the creator…"></textarea>',

async function doKycDecision(decision, id, name){
  const btn = $('#modalPrimary');
  if (btn){ btn.disabled = true; btn.textContent = 'Working…'; }
  const noteEl = $('#kycNote');
  const note = noteEl ? noteEl.value.trim() : '';
  try {
    await api('/api/admin/dashboard/kyc/' + encodeURIComponent(id) + '/decision',
      { method:'POST', body: Object.assign({ decision }, note ? { note } : {}) });
    closeModal();
    toast('KYC ' + (decision === 'approve' ? 'approved' : 'rejected') + ' for ' + (name || 'creator'),
      decision === 'approve' ? 'ok' : 'bad');

    updateKyc();
  } catch (e) {
    closeModal();
    if (e && e.code === 'auth'){ onApiError(e); }

/* ---------- hand-rolled SVG charts (no chart library) ---------- */
function bucketLabel(t, bucket){
  if (!t) return '';
  const d = new Date(t);
  if (isNaN(d)) return '';
  if (bucket === 'hour') return d.toLocaleString('en-GB', { timeZone:TZ, day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hour12:false });
  if (bucket === 'month') return d.toLocaleString('en-GB', { timeZone:TZ, month:'short', year:"2-digit" });
  return d.toLocaleString('en-GB', { timeZone:TZ, day:'numeric', month:'short' });
}
function niceCeil(max){
  if (!(max > 0)) return 1;
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const steps = [1, 2, 2.5, 5, 10];
  for (const s of steps){ if (raw <= s * mag) return s * mag * 4; }
  return 10 * mag * 4;
}
function svgFrameAxes(n, ceil, fmtY, bucket, tAt){
  const W = 640, H = 252, padL = 56, padR = 12, padT = 12, padB = 38;
  const pw = W - padL - padR, ph = H - padT - padB, step = pw / n;
  let body = '';
  for (let g = 0; g <= 4; g++){
    const v = ceil * g / 4, y = padT + ph - (ph * g / 4);
    body += '<line class="gridln" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (padL + pw) + '" y2="' + y.toFixed(1) + '"/>';
    body += '<text class="ax-r" x="' + (padL - 8) + '" y="' + (y + 4).toFixed(1) + '">' + esc(fmtY(v)) + '</text>';
  }
  const stride = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += stride){
    const x = padL + step * (i + 0.5);
    body += '<text class="ax-t" x="' + x.toFixed(1) + '" y="' + (padT + ph + 22) + '">' + esc(bucketLabel(tAt(i), bucket)) + '</text>';
  }
  return { W, H, padL, padT, ph, step, body };
}
function svgBarChart(buckets, bucket, get, fmtAxis, fmtTip){
  const n = buckets.length;
  const vals = buckets.map(get);
  const ceil = niceCeil(Math.max.apply(null, vals.concat([0])));
  const f = svgFrameAxes(n, ceil, fmtAxis, bucket, i => buckets[i].t);
  let body = f.body;
  for (let i = 0; i < n; i++){
    const h = Math.max(0, (vals[i] / ceil) * f.ph);
    const bw = Math.max(2, f.step * 0.62);
    const x = f.padL + f.step * (i + 0.5) - bw / 2;
    const y = f.padT + f.ph - h;
    const lbl = bucketLabel(buckets[i].t, bucket);
    body += '<rect class="bar hit" data-tip-l="' + esc(lbl) + '" data-tip-v="' + esc(fmtTip(vals[i])) +
      '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, h > 0 ? 1 : 0).toFixed(1) + '" rx="3"/>';
  }
  return '<svg class="chart-svg" viewBox="0 0 ' + f.W + ' ' + f.H + '" role="img" aria-label="Revenue bar chart">' + body + '</svg>';
}
function svgLineChart(buckets, bucket, get, fmtAxis, fmtTip){
  const n = buckets.length;
  const vals = buckets.map(get);
  const ceil = niceCeil(Math.max.apply(null, vals.concat([0])));
  const f = svgFrameAxes(n, ceil, fmtAxis, bucket, i => buckets[i].t);
  const pts = vals.map((v, i) => ({
    x: f.padL + f.step * (i + 0.5),
    y: f.padT + f.ph - (v / ceil) * f.ph,
  }));
  let body = f.body;
  if (n === 1){
    body += '<circle class="linedot hit" data-tip-l="' + esc(bucketLabel(buckets[0].t, bucket)) + '" data-tip-v="' + esc(fmtTip(vals[0])) +
      '" cx="' + pts[0].x.toFixed(1) + '" cy="' + pts[0].y.toFixed(1) + '" r="6"/>';
  } else if (n > 1){
    const base = (f.padT + f.ph).toFixed(1);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
    body += '<path class="areaf" d="' + line + ' L' + pts[n - 1].x.toFixed(1) + ' ' + base + ' L' + pts[0].x.toFixed(1) + ' ' + base + ' Z"/>';
    body += '<path class="linep" d="' + line + '"/>';
    body += pts.map((p, i) =>
      '<circle class="linedot" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.5"/>' +
      '<circle class="hit" data-tip-l="' + esc(bucketLabel(buckets[i].t, bucket)) + '" data-tip-v="' + esc(fmtTip(vals[i])) +
      '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="11"/>'
    ).join('');
  }
  return '<svg class="chart-svg" viewBox="0 0 ' + f.W + ' ' + f.H + '" role="img" aria-label="Calls line chart">' + body + '</svg>';
}
/* Position the card's tooltip over the hovered data point. */
function wireChartTips(root){
  $$('.chart-card', root).forEach(card => {
    const tip = $('.chart-tip', card);
    if (!tip) return;
    $$('.hit', card).forEach(el => {
      const show = () => {
        tip.innerHTML = '<div class="tv">' + esc(el.dataset.tipV || '') + '</div><div class="tl">' + esc(el.dataset.tipL || '') + '</div>';
        tip.hidden = false;
        const cardBox = card.getBoundingClientRect();
        const box = el.getBoundingClientRect();
        tip.style.left = (box.left - cardBox.left + box.width / 2) + 'px';
        tip.style.top = Math.max(4, box.top - cardBox.top - 6) + 'px';
      };
      el.addEventListener('mouseenter', show);
      el.addEventListener('mousemove', show);
      el.addEventListener('mouseleave', () => { tip.hidden = true; });
      el.addEventListener('click', show);
    });
  });
}

/* ---------- COMMAND PALETTE (Ctrl+K) ---------- */
let palItems = [];      /* flat selectable items: {type:'nav'|'user'|'creator', ...} */
let palSel = 0;
let palSeq = 0;
function fuzzyScore(q, text){
  q = String(q || '').toLowerCase();
  text = String(text || '').toLowerCase();
  if (!q) return 1;
  let qi = 0, score = 0, streak = 0;
  for (let i = 0; i < text.length && qi < q.length; i++){
    if (text[i] === q[qi]){
      qi++;
      streak++;
      score += 2 + streak + ((i === 0 || text[i - 1] === ' ' || text[i - 1] === '-' || text[i - 1] === '_') ? 4 : 0);
    } else streak = 0;
  }
  return qi === q.length ? score + Math.max(0, 20 - text.length / 4) : -1;
}
function openPalette(){
  const w = $('#paletteWrap');
  w.innerHTML =
    '<div class="scrim" data-act="palette-close"></div>' +
    '<div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">' +
      '<div class="p-in">' + ICONS.search +
        '<input id="palInput" type="text" placeholder="Search pages, users, creators — name, phone, or member ID…" autocomplete="off" spellcheck="false" />' +
        '<kbd>esc</kbd></div>' +
      '<div class="p-list" id="palList"></div>' +
      '<div class="p-foot"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>' +
    '</div>';
  w.hidden = false;
  const input = $('#palInput');
  input.focus();
  renderPalette('', []);
  let t;
  input.addEventListener('input', () => {
    clearTimeout(t);
    const q = input.value.trim();
    if (!q){ renderPalette('', []); return; }
    renderPalette(q, null); /* searching state */
    t = setTimeout(() => searchPalette(q), 250);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); movePalSel(1); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); movePalSel(-1); }
    else if (e.key === 'Enter'){ e.preventDefault(); activatePalSel(); }
  });
}
function closePalette(){
  const w = $('#paletteWrap');
  w.hidden = true;
  w.innerHTML = '';
  palItems = [];
}
function renderPalette(q, people){
  const list = $('#palList');
  if (!list) return;
  palItems = [];
  let html = '';
  const navMatches = NAV
    .map(n => ({ tab:n[0], label:n[1], score: fuzzyScore(q, n[1]) }))
    .filter(x => x.score >= 0)
    .sort((a, b) => b.score - a.score);
  if (navMatches.length){
    html += '<div class="p-sec">Go to</div>';
    for (const n of navMatches){
      palItems.push({ type:'nav', tab:n.tab, label:n.label });
      html += '<button type="button" class="p-item" data-pal="' + (palItems.length - 1) + '">' +
        '<span class="pic">' + ICONS[n.tab] + '</span>' +
        '<span class="pmain"><span class="pt">' + esc(n.label) + '</span></span></button>';
    }
  }
  if (q){
    html += '<div class="p-sec">People</div>';
    if (people === null){
      html += '<div class="p-empty">Searching…</div>';
    } else if (!people.length){
      html += '<div class="p-empty">No people match "' + esc(q) + '"</div>';
    } else {
      for (const p of people){
        palItems.push({ type:p.kind, id:p.id, label:p.name });
        html += '<button type="button" class="p-item" data-pal="' + (palItems.length - 1) + '">' +
          '<span class="pic">' + esc(initials(p.name)) + '</span>' +
          '<span class="pmain"><span class="pt">' + esc(p.name || '—') + '</span>' +
          '<span class="ps">' + (p.kind === 'creator' ? 'Creator' : 'User') + ' · ' + esc(p.phone || '') +
          (p.memberId ? ' · ' + esc(p.memberId) : '') + '</span></span></button>';
      }
    }
  }
  if (!html) html = '<div class="p-empty">Start typing to search.</div>';
  list.innerHTML = html;
  palSel = 0;
  paintPalSel();
  $$('#palList [data-pal]').forEach(el => {
    el.addEventListener('mouseenter', () => { palSel = Number(el.dataset.pal); paintPalSel(); });
    el.addEventListener('click', () => { palSel = Number(el.dataset.pal); activatePalSel(); });
  });
}
async function searchPalette(q){
  const seq = ++palSeq;
  try {
    const [u, c] = await Promise.all([
      api('/api/admin/dashboard/users', { params:{ limit:8, offset:0, search:q } }).catch(() => ({ users:[] })),
      api('/api/admin/dashboard/creators', { params:{ limit:8, offset:0, search:q } }).catch(() => ({ creators:[] })),
    ]);
    if (seq !== palSeq) return;
    const people = [];
    for (const x of (u.users || [])) people.push({ kind:'user', id:x.id, name:x.name, phone:x.phone, memberId:x.memberId });
    for (const x of (c.creators || [])) people.push({ kind:'creator', id:x.id, name:x.name, phone:x.phone, memberId:x.memberId });
    people.sort((a, b) => Math.max(
        fuzzyScore(q, b.name), fuzzyScore(q, b.phone), fuzzyScore(q, b.memberId)) -
        Math.max(fuzzyScore(q, a.name), fuzzyScore(q, a.phone), fuzzyScore(q, a.memberId)));
    renderPalette(q, people);
  } catch (e) {
    if (seq === palSeq) renderPalette(q, []);
  }
}
function paintPalSel(){
  $$('#palList .p-item').forEach((el, i) => el.classList.toggle('sel', i === palSel));
  const sel = $('#palList .p-item.sel');
  if (sel) sel.scrollIntoView({ block:'nearest' });
}
function movePalSel(d){
  const n = $$('#palList .p-item').length;
  if (!n) return;
  palSel = (palSel + d + n) % n;
  paintPalSel();
}
function activatePalSel(){
  const items = $$('#palList .p-item');
  const item = palItems[palSel];
  if (!items.length || !item) return;
  closePalette();
  if (item.type === 'nav') gotoTab(item.tab);
  else openProfile(item.type, item.id);
}

/* ---------- global click delegation ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'logout'){
    try { localStorage.removeItem(LS_SECRET); } catch (e2) { /* ignore */ }
    doLogout();
    toast('Logged out', 'info');
    return;
  }
  if (act === 'theme'){ toggleTheme(); return; }
  if (act === 'open-palette'){ openPalette(); return; }
  if (act === 'palette-close'){ closePalette(); return; }
  if (act === 'refresh'){
    const ic = $('#refreshBtn svg');
    if (ic) ic.classList.add('spin');
    reloadCurrent().then(() => {
      if (ic) ic.classList.remove('spin');
      toast('Refreshed', 'ok');
    });
    return;
  }
  if (act === 'goto-calls'){ gotoTab('calls'); return; }
  if (act === 'retry'){ reloadCurrent(); return; }
  if (act === 'goto-approvals'){ gotoTab('approvals'); return; }
  if (act === 'goto-kyc'){ gotoTab('kyc'); return; }
  if (act === 'copy'){ copyText(el.dataset.copy); return; }
  if (act === 'export-users'){ exportTable('users'); return; }
  if (act === 'export-creators'){ exportTable('creators'); return; }
  if (act === 'export-calls'){ exportTable('calls'); return; }
  if (act === 'page-go'){
    const st = state[currentTab];
    const page = Number(el.dataset.page);
    if (st && typeof st.offset === 'number' && isFinite(page) && page >= 1){
      st.offset = (page - 1) * st.limit;
      if (currentTab === 'users') updateUsers();
      else if (currentTab === 'creators') updateCreators();
      else if (currentTab === 'calls') updateCalls();
      else if (currentTab === 'kyc') updateKyc();
      window.scrollTo({ top:0, behavior:'smooth' });
    }
    return;
  }
  if (act === 'modal-close'){ closeModal(); return; }
  if (act === 'modal-primary'){
    if (pendingModal && typeof pendingModal.onPrimary === 'function') pendingModal.onPrimary();
    return;
  }
  if (act === 'apprv-open'){ openApprovalConfirm('approve', el.dataset.id, el.dataset.name); return; }
  if (act === 'rjct-open'){ openApprovalConfirm('reject', el.dataset.id, el.dataset.name); return; }
  if (act === 'kyc-apprv-open'){ openKycConfirm('approve', el.dataset.id, el.dataset.name); return; }
  if (act === 'kyc-rjct-open'){ openKycConfirm('reject', el.dataset.id, el.dataset.name); return; }
  if (act === 'kyc-zoom'){
    const url = (state._kycDocs || {})[el.dataset.id];
    if (url) openZoom('Document preview', url, 'Enlarged identity document');
    return;
  }
  if (act === 'pkyc-zoom'){
    const url = (state._pfDocs || {})[el.dataset.id];
    if (url) openZoom('KYC document', url, 'Enlarged KYC document');
    return;
  }
  if (act === 'pmedia-zoom'){
    const url = (state._pfMedia || [])[Number(el.dataset.idx)];
    if (url) openZoom('Media', url, 'Enlarged profile media');
    return;
  }
  if (act === 'ov-range'){
    state.overview.range = el.dataset.range;
    setSegActive('ov-range', el.dataset.range);
    updateOverview();
    return;
  }
  if (act === 'rep-range'){
    state.reports.range = el.dataset.range;
    setSegActive('rep-range', el.dataset.range);
    updateReports();
    return;
  }
  if (act === 'profile-user'){ e.preventDefault(); openProfile('user', el.dataset.id); return; }
  if (act === 'profile-creator'){ e.preventDefault(); openProfile('creator', el.dataset.id); return; }
  if (act === 'profile-close'){ closeProfile(); return; }
  if (act === 'profile-retry'){ if (pfTarget) openProfile(pfTarget.kind, pfTarget.id); return; }
  if (act === 'csv-buckets'){ csvBuckets(); return; }
  if (act === 'csv-creators'){ csvCreators(); return; }
  if (act === 'csv-spenders'){ csvSpenders(); return; }
});

(function boot(){
  let saved = null;
  try { saved = localStorage.getItem(LS_SECRET); } catch (e) { /* storage unavailable */ }
  const hint = $('#loginHint');
  if (saved){
    $('#secretInput').value = saved;
    $('#rememberMe').checked = true;
    if (hint) hint.textContent = 'A secret is remembered on this device — press Unlock, or untick "Remember on this device" to forget it after this login.';
    $('#secretInput').focus();
  }
  showLogin(null);
  if (saved) $('#secretInput').value = saved;
})();
